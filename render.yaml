services:
  - type: web
    name: civicpulse-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VITE_API_URL
        sync: false
      - key: PYTHON_AI_SERVICE_URL
        value: http://civicpulse-python:8000
      - key: HIVE_SECRET_KEY
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1

  - type: web
    name: civicpulse-python
    env: python
    region: oregon
    plan: free
    buildCommand: cd server/python_chatbot && pip install -r requirements.txt
    startCommand: cd server/python_chatbot && uvicorn app:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: HIVE_SECRET_KEY
        sync: false
